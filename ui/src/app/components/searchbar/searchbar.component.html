<p-toast position="bottom-right" />
<p-inputGroup>
    <input type="text"
           tabindex="0"
           #searchInput
           pInputText
           placeholder="Search GeneSets"
           [(ngModel)]="searchValue"
           aria-describedby="search-help"
           (keydown.enter)="onSearch(searchInput.value)"
    />

    <button type="button"
            pButton label="Search"
            class="p-button-success search-button"
            (click)="onSearch(searchInput.value)"
    >
    </button>
</p-inputGroup>
<small id="search-help" class="block mt-2 text-color-secondary">
    Every term must match: <em>alcohol RNA-seq</em> or <em>alcohol, RNA-seq</em>. Put
    <strong>OR</strong> in capitals for either: <em>alcohol OR cocaine</em>. Together,
    <em>alcohol AND RNA-seq OR cocaine</em> finds gene sets with both alcohol and RNA-seq, or with
    cocaine.
</small>
<p-progressBar *ngIf="isSearching" 
               mode="indeterminate" 
               [style]="{ height: '6px' }" />
