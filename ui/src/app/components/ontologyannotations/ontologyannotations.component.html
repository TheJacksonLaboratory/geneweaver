<div class="card flex flex-row justify-between items-center gap-4 mb-4">
  <app-ontology-tag-key [ontology_terms]="ontology_tags"></app-ontology-tag-key>

  <div class="flex flex-wrap gap-2">
    @for (ontology of ontology_tags; track ontology) {
      <app-ontology-tag
        [ontology]="ontology">
      </app-ontology-tag>
    }
  </div>
</div>
