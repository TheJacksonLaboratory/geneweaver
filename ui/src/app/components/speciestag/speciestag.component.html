        'white-space': 'nowrap',
        'border-radius': '2px',
        'border': '1px solid',
        'background-color': 'var(--' + getSpeciesColor() + '-100)',
        'color': 'var(--' + getSpeciesColor() + '-700)',

    }"
></p-tag>
