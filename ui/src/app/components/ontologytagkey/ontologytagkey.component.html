<div class="card flex flex-wrap justify-center gap-2">

  @for (ontology of source_ontologies; track ontology) {
    <p-tag
      [value]="ontology.name"
      styleClass="text-xs"
        [style]="{
        'white-space': 'nowrap',
        'border-radius': '4px',
        'border': '1px solid',
        'background-color': 'var(--' + ontology.color + '-100)',
        'color': 'black',
    }"
    ></p-tag>
  }
</div>
