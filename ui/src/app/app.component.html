<main class="w-full">
  <p-messages severity="info" closable="false">
    <ng-template pTemplate>
      <div class="ml-2 text-sm">A new search experiment from GeneWeaver.</div>
      <div class="ml-2 ml-auto text-xs">v{{version}}</div>
      <!-- Sign-in is server-side (the API holds the Auth0 client secret), so these are
      plain links to the API, not client-side auth calls. -->
      @if (session.state$ | async; as state) {
        <!-- Sign-out is a form POST, not a link: the API only accepts it from this site
        (a GET would let any other site sign the user out). -->
        @if (state.authenticated) {
          <form class="ml-3 text-xs inline" method="post"
            [action]="session.signOutUrl()">
            {{ state.name || state.email }} ·
            <button type="submit" class="sign-out p-0 border-none bg-transparent cursor-pointer underline text-xs">Sign out</button>
          </form>
        }
        @if (!state.authenticated && state.loginAvailable) {
          <a class="ml-3 text-xs"
          [href]="session.signInUrl()">Sign in</a>
        }
      }
    </ng-template>
  </p-messages>
  <router-outlet />
</main>
