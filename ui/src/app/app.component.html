<main class="w-full">
    <p-messages severity="info" closable="false">
        <ng-template pTemplate>
            <div class="ml-2 text-sm">A new search experiment from GeneWeaver.</div>
            <div class="ml-2 ml-auto text-xs">v{{version}}</div>
            <!-- Sign-in is server-side (the API holds the Auth0 client secret), so these are
                 plain links to the API, not client-side auth calls. -->
            <ng-container *ngIf="session.state$ | async as state">
                <span *ngIf="state.authenticated" class="ml-3 text-xs">
                    {{ state.name || state.email }} ·
                    <a [href]="session.signOutUrl()">Sign out</a>
                </span>
                <a *ngIf="!state.authenticated && state.loginAvailable" class="ml-3 text-xs"
                   [href]="session.signInUrl()">Sign in</a>
            </ng-container>
        </ng-template>
    </p-messages>
    <router-outlet />
</main>
