apiVersion: apps/v1
kind: Deployment
metadata:
  name: geneweaver-legacy
  labels:
    app: geneweaver-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geneweaver-legacy
  template:
    metadata:
      labels:
        app: geneweaver-legacy
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: workload-identity-geneweaver
      volumes:
        - name: geneweaver-legacy
          persistentVolumeClaim:
            claimName: geneweaver-pvc
      containers:
        - name: geneweaver-legacy
          image: geneweaver-legacy
          imagePullPolicy: Always
          volumeMounts:
            - name: geneweaver-legacy
              mountPath: /var/geneweaver/results
          env:
            # Gunicorn runs ONE worker unless told otherwise: its `workers` default is
            # int(os.environ.get("WEB_CONCURRENCY", 1)), and the Dockerfile CMD passes no
            # --workers. With a single worker per pod the app has no concurrency at all --
            # one slow request occupies the pod, every other request queues behind it, and
            # the old `--timeout 300` held that worker for five minutes. Under sustained
            # traffic the backlog then never drained: each replacement worker immediately
            # picked up another queued request and was killed in turn.
            #
            # That is exactly how prod collapsed on 2026-09-16: it served normally for
            # 4h51m after the 1.6.0 deploy, then one slow search at 00:30 UTC saturated the
            # single worker and the pod never recovered -- 11 worker timeouts, one every
            # ~5 minutes, with even static files timing out because nothing reached a free
            # worker. CPU stayed at ~1 millicore and the database at 15 of 600 connections
            # throughout, so this was queueing, not load. Stage never showed it: same image,
            # no traffic, so no queue.
            #
            # Four sync workers fit the web container's measured memory budget while
            # giving every pod capacity to serve health checks and ordinary pages when a
            # slow request is being terminated by Gunicorn's 60-second upper bound.
            - name: WEB_CONCURRENCY
              value: "4"
            - name: CELERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
            - name: CELERY_RESULT_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
          envFrom:
            - configMapRef:
                name: geneweaver-legacy-config
            - secretRef:
                name: geneweaver-db
            - secretRef:
                name: geneweaver-legacy-secrets
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            # Give Gunicorn time to replace individual timed-out workers before
            # restarting the entire web container.
            failureThreshold: 12
        - name: geneweaver-legacy-search
          image: geneweaver-legacy
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: geneweaver-db
          env:
            # The sidecar's nightly full reindex runs at 00:00 America/New_York
            # (start_sphinx.sh, G3-814). The container clock is UTC, so set the zone
            # explicitly; TZ (with tzdata in the image) keeps midnight correct across
            # the EST/EDT change, which a hardcoded UTC hour would not.
            - name: TZ
              value: America/New_York
          ports:
            - name: sphinx
              containerPort: 9312
          startupProbe:
            tcpSocket:
              port: sphinx
            periodSeconds: 5
            timeoutSeconds: 2
            # A production cold index took about four minutes during the incident.
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: sphinx
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: sphinx
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          command: ["/bin/bash", "-c", "/app/sphinx/start_sphinx.sh"]
