# Shared by both tool-worker deployments.
#
# TEMPORAL_URI/TEMPORAL_NAMESPACE are per environment and set in each overlay; the
# namespaces are dev, sqa, stage and prod, matching AsyncTask's own worker configuration so
# the tools land in the same Temporal namespace as the runs that schedule them.
#
# The task-queue names are deliberately absent: they are constants in the plugin, not
# configuration. `GeneWeaverToolWorkflow` schedules activities from inside *AsyncTask's*
# worker, so a value set here would reach only the consumer and every run would sit
# unclaimed on a queue nobody produced to. See temporal/routing.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: geneweaver-tools-config
data:
  # Same value in every environment; the namespace is what differs. Taken from asynctask's
  # own base configmap so the workers reach the same Temporal frontend as the service that
  # schedules their work.
  TEMPORAL_URI: "temporal-frontend.temporal.svc.cluster.local:7233"
  # Overridden per overlay; the base value keeps a mis-wired overlay from silently landing
  # in a shared namespace.
  TEMPORAL_NAMESPACE: "default"
  # Low on purpose: a tool run can saturate a core for minutes, so concurrency per pod is
  # kept small and throughput comes from replicas. asynctask-mpd-plugin uses 5.
  MAX_CONCURRENT_ACTIVITIES: "5"
  LOG_LEVEL: "INFO"
