apiVersion: apps/v1
kind: Deployment
metadata:
  name: geneweaver-api
  labels:
    app: geneweaver-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geneweaver-api
  template:
    metadata:
      labels:
        app: geneweaver-api
    spec:
      serviceAccountName: workload-identity-geneweaver
      containers:
        - name: geneweaver-api
          image: geneweaver-api
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: geneweaver-config
            - secretRef:
                name: geneweaver-db
            # AUTH_LOGIN_CLIENT_SECRET and AUTH_SESSION_KEY for server-side sign-in.
            # Optional so an environment without it still starts, with sign-in off.
            - secretRef:
                name: geneweaver-api-auth
                optional: true
          ports:
            - containerPort: 8000