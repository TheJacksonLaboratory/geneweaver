[project]
name = "geneweaver-tools-plugin"
version = "0.20.0a0"
description = "The AsyncTask plugin for the GeneWeaver tools: the workflow and where it sends each tool."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jax Data Science", email = "cssc@jax.org" },
]

# The Temporal SDK and nothing else. This is what AsyncTask installs, so it must not pull in
# the tools, their scientific libraries or a database driver: the workflow only routes a
# request to the worker that runs it. `test_clean_import` and the publish job's clean-install
# smoke test hold that line.
dependencies = [
    "temporalio>=1.9.0",
]

# Only the workflow is offered to AsyncTask. There is deliberately no
# `jax.ats.plugins.temporal.activities` entry: the activity runs on GeneWeaver's own workers
# (geneweaver-tools[temporal]), which the workflow reaches by activity name and task queue,
# so AsyncTask never registers or imports it.
[project.entry-points."jax.ats.plugins"]
GeneWeaverTools = "geneweaver.tools_plugin.workflows:GeneWeaverToolWorkflow"

[project.entry-points."jax.ats.plugins.temporal.workflows"]
GeneWeaverToolWorkflows = "geneweaver.tools_plugin.workflows:WORKFLOWS"

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver"

[dependency-groups]
dev = [
    "pytest>=7.1.3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.tools_plugin"
