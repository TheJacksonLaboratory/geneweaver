[project]
name = "geneweaver-client"
version = "0.20.0a0"
description = "A Python Client for the Geneweaver API"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jax Data Science", email = "cssc@jax.org" },
]

dependencies = [
    "requests>=2.28",
    "pydantic[dotenv]>=2.0.0",
    "pydantic-settings>=2.4.0",
    "geneweaver-core>=0.10.0a3",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.0",
    "auth0-python>=4.7.0",
    "pandas>=1.5.0,<3.0.0",
    "xlrd>=2.0.0",
]

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver-docs/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver-client"

[project.scripts]
gweave = "geneweaver.client.cli.main:cli"
gweaver = "geneweaver.client.cli.main:cli"

[dependency-groups]
dev = [
    { include-group = "test" },
    "wget>=3.2.0",
]
test = [
    "testcontainers-neo4j>=0.0.1rc1",
    "neomodel>=5.2.1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.client"
