[project]
name = "geneweaver-tools"
version = "0.20.0a0"
description = "A framework to allow for consistent implementation of tools for the GeneWeaver project."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jax Data Science", email = "cssc@jax.org" },
]

dependencies = [
    # pydantic, not geneweaver-core. The tools import `pydantic` in ten places and
    # `geneweaver.core` in none -- core was declared but unused, and pydantic was used but
    # undeclared, arriving transitively through core. Verified by installing the wheel with
    # `--no-deps` and no core present: all nine tools still load.
    #
    # `geneweaver-core` still arrives with the `db` extra, via `geneweaver-db`, which is
    # where it is genuinely used (`GeneIdentifier` in `db.tool_input`).
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
# In-process (no compiled binary) implementations that use C/C++-backed libraries
# (scipy/scikit-learn) instead of shelling out to TOOLBOX binaries.
sklearn = [
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]
# Resolving large tool input from the database, for the Temporal activity only (G3-784:
# MSET's gene universe is ~100,000 identifiers, too large to send through Temporal). The
# tools themselves never take a connection; see temporal/resolvers.py.
db = [
    "geneweaver-db>=0.20.0a0",
    "psycopg[binary]>=3.1.0",
]
# The worker side of AsyncTask: the activity that runs a tool and the worker process
# (`geneweaver.tools.temporal`), for GeneWeaver's two tool-worker images. The plugin brings
# the workflow's queue and activity names, which the worker reads rather than restates.
# AsyncTask installs `geneweaver-tools-plugin` alone, never this. Kept optional: callers
# that only need the compute classes and schemas -- the GeneWeaver API, for one -- should
# not pull in a workflow runtime.
temporal = [
    "geneweaver-tools-plugin>=0.20.0a0",
    "temporalio>=1.9.0",
]

# Tool registry. Our own group, deliberately not `jax.ats.plugins`: AsyncTask reads
# that group and hands whatever it finds to `start_workflow`, which only accepts a
# Temporal workflow. Registering bare `AbstractTool` classes there would look correct
# and fail at run time. AsyncTask is offered the workflow below; this group is what the
# activity resolves a tool name against.
#
# `BinaryDBSCAN` is deliberately absent: it is the legacy-parity fallback, not the
# canonical implementation (see docs/tools/TOOLS_BENCHMARKS.md 1).
[project.entry-points."geneweaver.tools"]
boolean_algebra = "geneweaver.tools.boolean_algebra:BooleanAlgebra"
combine = "geneweaver.tools.combine:Combine"
dbscan = "geneweaver.tools.dbscan:DBSCAN"
hypergeometric = "geneweaver.tools.hypergeometric:HyperGeometric"
jaccard_clustering = "geneweaver.tools.jaccard_clustering:JaccardClustering"
jaccard_similarity = "geneweaver.tools.jaccard_similarity:JaccardSimilarity"
mset = "geneweaver.tools.mset:MSET"
phenome_map = "geneweaver.tools.phenome_map:PhenomeMap"
upset = "geneweaver.tools.upset:UpSet"

# No `jax.ats.plugins*` entry points: AsyncTask is offered the workflow by
# `geneweaver-tools-plugin`, and does not install this package at all.

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver"

[dependency-groups]
dev = [
    "pytest>=7.1.3",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.tools"
