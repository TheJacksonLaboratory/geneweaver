[project]
name = "geneweaver-tools"
version = "0.20.0a0"
description = "A framework to allow for consistent implementation of tools for the GeneWeaver project."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jax Data Science", email = "cssc@jax.org" },
]

dependencies = [
    "geneweaver-core>=0.20.0a0",
]

[project.optional-dependencies]
# In-process (no compiled binary) implementations that use C/C++-backed libraries
# (scipy/scikit-learn) instead of shelling out to TOOLBOX binaries.
sklearn = [
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

# The AsyncTask service (bitbucket.org/jacksonlaboratory/asynctask) discovers work
# through this entry-point group and loads each target with importlib.metadata. Its
# loader raises on duplicate plugin names across *all* installed plugins, and
# `geneweaver-boolean-algebra` is already installed there, so every name here is
# namespaced under `geneweaver.`.
#
# `BinaryDBSCAN` is deliberately not registered: it is the legacy-parity fallback, not
# the canonical implementation (see docs/tools/TOOLS_BENCHMARKS.md 1).
[project.entry-points."jax.ats.plugins"]
"geneweaver.boolean_algebra" = "geneweaver.tools.boolean_algebra:BooleanAlgebra"
"geneweaver.combine" = "geneweaver.tools.combine:Combine"
"geneweaver.dbscan" = "geneweaver.tools.dbscan:DBSCAN"
"geneweaver.hypergeometric" = "geneweaver.tools.hypergeometric:HyperGeometric"
"geneweaver.jaccard_clustering" = "geneweaver.tools.jaccard_clustering:JaccardClustering"
"geneweaver.jaccard_similarity" = "geneweaver.tools.jaccard_similarity:JaccardSimilarity"
"geneweaver.mset" = "geneweaver.tools.mset:MSET"
"geneweaver.phenome_map" = "geneweaver.tools.phenome_map:PhenomeMap"
"geneweaver.upset" = "geneweaver.tools.upset:UpSet"

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver"

[dependency-groups]
dev = [
    "pytest>=7.1.3",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.tools"
