[project]
name = "geneweaver-core"
version = "0.20.0a0"
description = "The core of the Jax-Geneweaver Python library"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jax Computational Sciences", email = "cssc@jax.org" },
]

dependencies = [
    "pydantic>=2.8.0",
    "openpyxl>=3.1.2",
    "numpy>=1.22.0,<2.0.0",
    "pandas>=1.5.0,<3.0.0",
    "requests>=2.32.0",
    "pydantic-settings>=2.3.0",
]

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver-docs/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver-client"

[dependency-groups]
dev = [
    "pylint>=2.15.4",
    "pytest>=7.1.3",
    "pydocstyle>=6.1.1",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.core"
