[project]
name = "geneweaver-api"
version = "0.20.0a0"
description = "The Geneweaver API"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "Apache-2.0" }

authors = [
    { name = "Alexander Berger", email = "alexander.berger@jax.org" },
    { name = "Francisco Castellanos", email = "francisco.castellanos@jax.org" },
    { name = "Sejal Desai", email = "sejal.desai@jax.org" },
]

dependencies = [
    "geneweaver-core>=0.20.0a0",
    "fastapi[all]>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "geneweaver-db>=0.20.0a0",
    "psycopg-pool>=3.1.7",
    "requests>=2.32.3",
    "python-jose[cryptography]>=3.3.0",
    "psycopg-binary==3.1.18",
    "pydantic-settings>=2.3.4",
    "jax-apiutils>=0.2.0a0",
]

[project.urls]
Homepage = "https://thejacksonlaboratory.github.io/geneweaver-docs/"
Repository = "https://github.com/TheJacksonLaboratory/geneweaver-api"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.21.0",
    "ruff==0.15.11",
    # Shared pytest fixtures imported by packages/*/tests (geneweaver.testing.fixtures).
    "geneweaver-testing>=0.1.2",
]
# Documentation site (mkdocs.yml + docs/). Previously lived in the standalone
# TheJacksonLaboratory/geneweaver-docs repo, which this replaces.
# mkdocs >=1.6 is required for the `exclude_docs` key used in mkdocs.yml.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5.11",
    "mkdocs-jupyter>=0.24.2",
]

[tool.uv]
# geneweaver-testing pins ruff<0.3 for its own lint command, which is unsatisfiable
# against this project's ruff==0.15.11. We only use its pytest fixtures, so override the
# ruff pin. (Its pytest<9 / pytest-cov<5 caps are left to resolve naturally — pytest 9
# requires Python 3.10+ while this project supports 3.9, so we must not force pytest>=9.)
override-dependencies = [
    "ruff==0.15.11",
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
geneweaver-core   = { workspace = true }
geneweaver-db     = { workspace = true }
geneweaver-client = { workspace = true }
geneweaver-tools  = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geneweaver.api"

# TODO: Remove this when batch API is hooked up and tested.
[tool.coverage.report]
omit = ["*/batch.py"]
