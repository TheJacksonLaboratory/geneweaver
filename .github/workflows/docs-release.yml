name: Docs — Publish

# Publishes the documentation site to GitHub Pages on pushes to main that touch
# the docs sources. This monorepo owns the documentation site; the standalone
# TheJacksonLaboratory/geneweaver-docs repo it replaces is to be archived.
#
# RETIRING THE OLD SITE: this does NOT contend with geneweaver-docs. Each repo's
# gh-deploy pushes to its own gh-pages branch and serves its own project path
# (/geneweaver-docs/ versus /geneweaver/), so there is no race and archiving is
# not a precondition for merging this. Archiving that repo is still worth doing,
# to retire a second, diverging copy of the docs rather than to avoid a clash.
# As of 2026-08-14 it is not archived, merely dormant (last push 2025-01-07).
#
# LIVE AND PUBLIC (verified 2026-09-17). Pages is configured and serving from the
# gh-pages branch at https://thejacksonlaboratory.github.io/geneweaver/, the repo
# is public and the Pages site is public with it, so an anonymous visitor reaches
# the docs. The app's Help links point here and shipped to Prod in 1.6.2.
#
# This replaces two warnings that were true when written on 2026-08-14 and are not
# now: that no Pages site or gh-pages branch existed, and that the repo was
# internal so its site was org-only and had to be made public before the Help
# links could reach Prod. Both preconditions are satisfied. They are recorded here
# rather than deleted because "the site is org-only" would otherwise look like an
# open Prod gate to anyone reading the release plan, which still referenced it.
#
# The published URL changed with the repo name:
#   old  https://thejacksonlaboratory.github.io/geneweaver-docs/
#   new  https://thejacksonlaboratory.github.io/geneweaver/
# Archiving the old repo leaves its site served read-only, so existing links keep
# working but go stale. Every [project.urls] entry across the five pyproject.toml
# files now points at the new site and at this monorepo; four of the five
# Repository URLs had pointed at the pre-monorepo standalone repos, which are
# archived.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-*.yml'
      - '.github/workflows/_docs-action.yml'
  # Allows a manual publish without waiting for a docs change to land.
  workflow_dispatch:

jobs:
  publish:
    name: "Docs Publish: GitHub Pages"
    # Required: this repo's default GITHUB_TOKEN is read-only, and a called
    # workflow cannot hold permissions the caller does not. Without this,
    # _docs-action.yml's `contents: write` is capped to read and gh-deploy's
    # push to gh-pages fails with a 403.
    permissions:
      contents: write
    uses: ./.github/workflows/_docs-action.yml
    with:
      deploy: true
