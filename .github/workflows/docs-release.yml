name: Docs — Publish

# Publishes the documentation site to GitHub Pages on pushes to main that touch
# the docs sources. This monorepo owns the documentation site; the standalone
# TheJacksonLaboratory/geneweaver-docs repo it replaces is to be archived.
#
# PRECONDITION: geneweaver-docs must be archived (or its mkdocs_deploy.yml
# removed) before this merges to main. Both repos publish a gh-pages site, and
# while both pipelines are armed whichever runs last wins. As of 2026-08-14 that
# repo is NOT yet archived — it is merely dormant (last push 2025-01-07), so it
# only redeploys if someone pushes to its main.
#
# ALSO REQUIRED: this repo has no GitHub Pages site configured and no gh-pages
# branch (checked 2026-08-14). The first run of this workflow creates the branch;
# Pages must then be turned on with its source set to gh-pages, or the deploy
# succeeds while nothing is served. Settings > Pages, or:
#   gh api -X POST repos/TheJacksonLaboratory/geneweaver/pages \
#     -f 'source[branch]=gh-pages' -f 'source[path]=/'
#
# SITE VISIBILITY: geneweaver-docs is a public repo; this one is internal, so
# Pages served from here is reachable only by the org. That is accepted while
# the docs ride on dev. It must be made public — repo visibility, GitHub Pages
# visibility on Enterprise Cloud, or a public host / custom domain — before the
# app's Help links (docs/repoint-docs-urls-to-monorepo) reach prod, or external
# users of geneweaver.org get an org login instead of the documentation.
#
# The published URL changes with the repo name:
#   old  https://thejacksonlaboratory.github.io/geneweaver-docs/
#   new  https://thejacksonlaboratory.github.io/geneweaver/
# Archiving leaves the old site served read-only, so existing links keep working
# but go stale. [project.urls].Homepage in pyproject.toml and the badges in
# docs/README.md still point at the old location.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-*.yml'
      - '.github/workflows/_docs-action.yml'
  # Allows a manual publish without waiting for a docs change to land.
  workflow_dispatch:

jobs:
  publish:
    name: "Docs Publish: GitHub Pages"
    uses: ./.github/workflows/_docs-action.yml
    with:
      deploy: true
