name: Publish Python Packages — internal dev index

# Releases the workspace packages at the exact version in `pyproject.toml`.
#
# Day-to-day publishing does **not** come through here: `pull_requests.yml` publishes a
# `.devN` build of the same chain on every PR, so a consumer in another repository
# (AsyncTask) can integrate against a branch without it being merged. This workflow is for
# the real, immutable release of a version.
#
# Deliberately NOT part of release.yml. That workflow releases and deploys the API and
# triggers on the root `pyproject.toml`; a library release has its own consumers, and tying
# the two would mean republishing the packages on every API release.
#
# Release by tagging the version, e.g.:
#
#     git tag tools-v0.20.0a0 && git push origin tools-v0.20.0a0
#
# The tag version must match `pyproject.toml`; a mismatch fails rather than publishing
# something mislabelled. `workflow_dispatch` is there for recovery.

on:
  push:
    tags:
      - 'tools-v*'
  workflow_dispatch:
    inputs:
      dev_release:
        description: 'Publish a .devN build rather than the bare version'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: "Check the tag matches the package version"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#*-v}"
          PKG_VERSION=$(grep -m1 '^version = ' packages/tools/pyproject.toml | cut -d '"' -f 2)
          echo "tag: ${TAG_VERSION}    pyproject: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/tools version ${PKG_VERSION}"
            exit 1
          fi

  publish:
    name: "Package publish: Dev index (internal)"
    needs: [check-tag]
    # `always()` so a workflow_dispatch run, where check-tag is skipped, still proceeds.
    if: always() && (needs.check-tag.result == 'success' || needs.check-tag.result == 'skipped')
    uses: ./.github/workflows/_publish-package.yml
    secrets: inherit
    with:
      packages: "geneweaver-core geneweaver-db geneweaver-tools"
      smoke_package: "geneweaver-tools"
      extras: "sklearn temporal"
      dev_release: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_release || false }}
