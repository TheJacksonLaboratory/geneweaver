name: Legacy — Release (SQA → Stage → Prod)

# Promotes the legacy GeneWeaver app (legacy/) through sqa → stage → prod,
# mirroring the standalone geneweaver-legacy repo's release pipeline.
#
# TRIGGER: pushing a version tag, e.g. `git tag v1.6.0 && git push origin v1.6.0`.
# The tag is the release decision. Merging a version bump to main deliberately
# does NOT release -- that fired an unintended prod-bound run when a branch
# carrying a bump was merged, which is why this moved off a push/paths trigger.
#
# The tag must match the version in legacy/pyproject.toml; the version job fails
# the run if they disagree, so a release can never ship an image whose version
# does not match the code it was built from.
#
# A pre-release version (contains a letter, e.g. 1.6.1a0) deploys to SQA only; a
# full version (e.g. 1.6.1) promotes through Stage + Prod and drafts a GitHub
# release.
#
# Builds ONE image (to the prod registry, the _skaffold-build default) and
# deploys that same artifact to each environment. Each deploy is gated by its
# GitHub environment's required-reviewer protection.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  version:
    name: "Verify Tag Matches Version"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      prerelease: ${{ steps.version_check.outputs.prerelease }}
      version: ${{ steps.version_check.outputs.version }}
      schedule_prod_release: ${{ steps.version_check.outputs.schedule_prod_release }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install toml
      - name: Verify tag matches legacy/pyproject.toml
        id: version_check
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          code_version=$(python -c "import toml; print(toml.load('legacy/pyproject.toml')['tool']['poetry']['version'])")

          echo "Tag           : $tag  (version $tag_version)"
          echo "pyproject.toml: $code_version"

          # The tag is the release decision, but the image is built from the
          # code. If they disagree we would ship an artifact whose version does
          # not describe its contents, so fail loudly rather than guess.
          if [[ "$tag_version" != "$code_version" ]]; then
            echo "::error::Tag $tag implies version $tag_version but legacy/pyproject.toml is $code_version. \
          Bump legacy/pyproject.toml and re-tag, or tag the commit that carries the matching version."
            exit 1
          fi

          echo "version=$code_version" >> $GITHUB_OUTPUT

          # Pushing the tag IS the intent to release; nothing else to detect.
          echo "should_release=true" >> $GITHUB_OUTPUT

          if [[ $code_version =~ [a-zA-Z] ]]; then
            echo "Pre-release version -- SQA only"
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "schedule_prod_release=false" >> $GITHUB_OUTPUT
          else
            echo "Full release version -- SQA, then Stage + Prod"
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "schedule_prod_release=true" >> $GITHUB_OUTPUT
          fi

          cat $GITHUB_OUTPUT

  test:
    name: "Legacy Tests"
    needs: [ version ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_legacy-tests.yml

  build:
    name: "Legacy Build"
    needs: [ version, test ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-build-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      # default_image_repo omitted → prod registry (us-docker.pkg.dev/.../docker/geneweaver)

  deploy_sqa:
    name: "Legacy Deploy: SQA"
    needs: [ build, version ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-dev-10--sqa"

  deploy_stage:
    name: "Legacy Deploy: Stage"
    needs: [ build, version, deploy_sqa ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-prod-10--stage"

  deploy_prod:
    name: "Legacy Deploy: Prod"
    needs: [ build, version, deploy_stage ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-prod-10--prod"

  release:
    name: "Create GitHub Release Draft"
    runs-on: ubuntu-latest
    needs: [ deploy_prod, version ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach the release to the tag that triggered this run, rather than
          # minting a second, differently-named tag for the same release.
          tag_name: ${{ github.ref_name }}
          name: Legacy v${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease }}
          body: |
            Legacy GeneWeaver release v${{ needs.version.outputs.version }}

            Built from ${{ github.ref_name }} (${{ github.sha }}).
