name: Legacy - Build, Deploy and Release

# Builds and deploys the legacy GeneWeaver app (legacy/) through the environment
# promotion chain (sqa -> stage -> prod) when legacy/pyproject.toml's version
# changes on main. Mirrors the API release pipeline, scoped to the legacy subtree.
#
# Legacy is versioned and tagged independently of the API:
#   - version source: legacy/pyproject.toml  ([tool.poetry].version, e.g. 1.5.27)
#   - git tag namespace: legacy-v<version>   (avoids collision with API's v<version>)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'legacy/pyproject.toml'

permissions:
  contents: write

concurrency:
  group: legacy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: "Detect Legacy Version Change"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      prerelease: ${{ steps.version_check.outputs.prerelease }}
      version: ${{ steps.version_check.outputs.version }}
      schedule_prod_release: ${{ steps.version_check.outputs.schedule_prod_release }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for legacy version change
        id: version_check
        run: |
          set -euo pipefail

          # Extract legacy version from legacy/pyproject.toml ([tool.poetry].version)
          version=$(grep '^version = ' legacy/pyproject.toml | head -1 | cut -d '"' -f 2)
          echo "Legacy version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Release only if the namespaced tag does not already exist
          if git rev-parse "legacy-v$version" >/dev/null 2>&1; then
            echo "Version already released"
            SHOULD_RELEASE=false
          else
            echo "New version detected"
            SHOULD_RELEASE=true
          fi

          # Pre-release if the version string contains a letter (a/b/rc/dev/...)
          if [[ $version =~ [a-zA-Z] ]]; then
            echo "Pre-release version detected"
            PRERELEASE=true
          else
            echo "Full release version detected"
            PRERELEASE=false
          fi

          if [[ "$SHOULD_RELEASE" == "true" && "$PRERELEASE" == "false" ]]; then
            SCHEDULE_PROD_RELEASE=true
          else
            SCHEDULE_PROD_RELEASE=false
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "schedule_prod_release=$SCHEDULE_PROD_RELEASE" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Gates run in parallel with version detection; build waits on all of them.
  format-lint:
    name: "Legacy Python Format and Lint"
    uses: ./.github/workflows/_legacy-format-lint.yml
    with:
      python-version: '3.9'

  ui-lint:
    name: "Legacy UI Lint"
    uses: ./.github/workflows/_legacy-ui-lint.yml

  test:
    name: "Legacy Run Tests"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9']
    uses: ./.github/workflows/_legacy-run-tests.yml
    with:
      runner-os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  build:
    name: "Legacy Build"
    needs: [ version, format-lint, ui-lint, test ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-build-k8s.yml
    secrets: inherit
    with:
      working_directory: "legacy"
      artifact_name: "build-artifact-json-legacy"

  deploy_sqa:
    name: "Legacy Deploy: SQA"
    needs: [ build, version ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: "legacy"
      artifact_name: "build-artifact-json-legacy"
      environment: "jax-cluster-dev-10--sqa"

  deploy_stage:
    name: "Legacy Deploy: Stage"
    needs: [ build, version, deploy_sqa ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: "legacy"
      artifact_name: "build-artifact-json-legacy"
      environment: "jax-cluster-prod-10--stage"

  deploy_prod:
    name: "Legacy Deploy: Prod"
    needs: [ build, version, deploy_stage ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: "legacy"
      artifact_name: "build-artifact-json-legacy"
      environment: "jax-cluster-prod-10--prod"

  release:
    name: "Create Legacy GitHub Release Draft"
    runs-on: ubuntu-latest
    needs: [ version, deploy_prod ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: legacy-v${{ needs.version.outputs.version }}
          name: "Legacy Release v${{ needs.version.outputs.version }}"
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease }}
          body: |
            Legacy GeneWeaver release v${{ needs.version.outputs.version }}
