name: Legacy — Release (SQA → Stage → Prod)

# Promotes the legacy GeneWeaver app (legacy/) through sqa → stage → prod,
# mirroring the standalone geneweaver-legacy repo's release pipeline. Triggered
# by a version bump in legacy/pyproject.toml on main. A pre-release version
# (contains a letter, e.g. 1.5.28a0) deploys to SQA only; a full version
# (e.g. 1.5.28) promotes through Stage + Prod and drafts a GitHub release.
#
# Builds ONE image (to the prod registry, the _skaffold-build default) and
# deploys that same artifact to each environment. Each deploy is gated by its
# GitHub environment's required-reviewer protection.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'legacy/pyproject.toml'

permissions:
  contents: write

jobs:
  version:
    name: "Detect Version Change"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      prerelease: ${{ steps.version_check.outputs.prerelease }}
      version: ${{ steps.version_check.outputs.version }}
      schedule_prod_release: ${{ steps.version_check.outputs.schedule_prod_release }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # need history + tags to test whether this version was already released
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install toml
      - name: Check for version change
        id: version_check
        run: |
          version=$(python -c "import toml; print(toml.load('legacy/pyproject.toml')['tool']['poetry']['version'])")
          echo "Version=$version"
          echo "version=$version" >> $GITHUB_OUTPUT

          # Legacy tags are namespaced (legacy-v*) so they don't collide with
          # the API/UI release tags that also live in this monorepo.
          if git rev-parse "legacy-v$version" >/dev/null 2>&1; then
            echo "Version already released"; SHOULD_RELEASE=false
          else
            echo "New version detected"; SHOULD_RELEASE=true
          fi

          if [[ $version =~ [a-zA-Z] ]]; then
            echo "Pre-release version detected"; PRERELEASE=true
          else
            echo "Full release version detected"; PRERELEASE=false
          fi

          if [[ "$SHOULD_RELEASE" == "true" && "$PRERELEASE" == "false" ]]; then
            SCHEDULE_PROD_RELEASE=true
          else
            SCHEDULE_PROD_RELEASE=false
          fi

          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "schedule_prod_release=$SCHEDULE_PROD_RELEASE" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  test:
    name: "Legacy Tests"
    needs: [ version ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_legacy-tests.yml

  build:
    name: "Legacy Build"
    needs: [ version, test ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-build-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      # default_image_repo omitted → prod registry (us-docker.pkg.dev/.../docker/geneweaver)

  deploy_sqa:
    name: "Legacy Deploy: SQA"
    needs: [ build, version ]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-dev-10--sqa"

  deploy_stage:
    name: "Legacy Deploy: Stage"
    needs: [ build, version, deploy_sqa ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-prod-10--stage"

  deploy_prod:
    name: "Legacy Deploy: Prod"
    needs: [ build, version, deploy_stage ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      working_directory: legacy
      artifact_name: legacy-build
      environment: "jax-cluster-prod-10--prod"

  release:
    name: "Create GitHub Release Draft"
    runs-on: ubuntu-latest
    needs: [ deploy_prod, version ]
    if: ${{ needs.version.outputs.schedule_prod_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: legacy-v${{ needs.version.outputs.version }}
          name: Legacy v${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease }}
          body: |
            Legacy GeneWeaver release v${{ needs.version.outputs.version }}
