name: 'Python Tests Definition'
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to set up'
        required: false
        default: '3.10'
        type: string
      runner-os:
        description: 'Runner OS'
        required: false
        default: 'ubuntu-latest'
        type: string
      upload-coverage:
        description: 'Upload coverage results'
        default: true
        type: boolean
      required-coverage:
        description: 'Required coverage percentage'
        default: "75"
        type: string

jobs:
  run-tests:
    runs-on: ${{ inputs.runner-os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --all-packages --all-extras --all-groups

      - name: Test with pytest
        run: |
          set -euo pipefail

          # Root tests
          if [ -d "tests" ]; then
            echo "Running root tests"
            uv run pytest tests
          fi

          # Package tests: run each package's UNIT tests only. Integration tests
          # (packages/*/tests/integration) need external infra — NCBI eutils, a neo4j
          # container, etc. — and are run separately, not in this gate.
          for pkg in packages/*; do
            if [ -d "$pkg/tests/unit" ]; then
              echo "Running unit tests in "$pkg/tests/unit""
              # Run from the package dir so cwd-relative test data paths resolve.
              ( cd "$pkg" && uv run pytest tests/unit )
            fi
          done
