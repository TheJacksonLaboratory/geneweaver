name: 'UI Code Integrity'

# Lint + test gate for the monorepo UI (ui/). Mirrors geneweaver-ui's Bitbucket
# "code-integrity" step: npm ci -> seed environment.ts -> nx lint -> nx test.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '22'
        type: string

jobs:
  code-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed environment.ts
        run: cp ./src/environments/environment.default.ts ./src/environments/environment.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
