name: Build, Deploy and Release

on:
  push:
    branches: [ main, master ]
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-lint:
    name: "Format and Lint"
    uses: ./.github/workflows/_format-lint-action.yml
    with:
      python-version: '3.10'

  check-coverage:
    name: "Check Coverage"
    needs: [format-lint]
    uses: ./.github/workflows/_check-coverage-action.yml
    permissions:
      pull-requests: write
    with:
      required-coverage: ${{ vars.REQUIRED_COVERAGE }}
      coverage-module: "geneweaver.api"

  test:
    name: "Run Tests"
    needs: [check-coverage, format-lint]
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    uses: ./.github/workflows/_run-tests-action.yml
    with:
      runner-os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      required-coverage: ${{ vars.REQUIRED_COVERAGE }}

  detect-version-change:
    name: "Detect Version Change"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      has-change: ${{ steps.detect.outputs.has-change }}
      schedule_prod_release: ${{ steps.detect.outputs.schedule_prod_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect root version change
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          HAS_CHANGE="false"
          VERSION=""
          IS_PRERELEASE="false"

          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          if [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            :
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BEFORE_SHA="$(git rev-parse HEAD~1)"
          else
            BEFORE_SHA="$EMPTY_TREE"
          fi

          if git diff "$BEFORE_SHA" HEAD -- pyproject.toml | grep -qE '^\+version\s*=\s*["'\''"]'; then
            VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d '"' -f 2)

            if echo "$VERSION" | grep -qE '([.-]?(a|b|rc|dev|pre|preview))[0-9]*'; then
              IS_PRERELEASE="true"
            fi

            HAS_CHANGE="true"
            echo "Version change detected: $VERSION (prerelease: $IS_PRERELEASE)"
          else
            echo "No version change detected in root pyproject.toml"
          fi

          if [[ "$HAS_CHANGE" == "true" && "$IS_PRERELEASE" == "false" ]]; then
            export SCHEDULE_PROD_RELEASE=true
          else
            export SCHEDULE_PROD_RELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "has-change=$HAS_CHANGE" >> "$GITHUB_OUTPUT"
          echo "schedule_prod_release=$SCHEDULE_PROD_RELEASE" >> "$GITHUB_OUTPUT"

  verify-version-sync:
    name: "Verify Version Sync"
    runs-on: ubuntu-latest
    needs: detect-version-change
    if: needs.detect-version-change.outputs.has-change == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Verify all packages match root version
        env:
          ROOT_VERSION: ${{ needs.detect-version-change.outputs.version }}
        run: |
          set -euo pipefail

          MISMATCH=0
          for toml in packages/*/pyproject.toml; do
            PKG_NAME=$(grep '^name = ' "$toml" | head -1 | cut -d '"' -f 2)
            PKG_VERSION=$(grep '^version = ' "$toml" | head -1 | cut -d '"' -f 2)
            if [ "$PKG_VERSION" != "$ROOT_VERSION" ]; then
              echo "::error::$PKG_NAME version ($PKG_VERSION) does not match root ($ROOT_VERSION)"
              MISMATCH=1
            else
              echo "$PKG_NAME: $PKG_VERSION (ok)"
            fi
          done

          if [ "$MISMATCH" -ne 0 ]; then
                          echo "::error::Package versions are out of sync. Run ./scripts/sync-versions.sh"            exit 1
          fi
          echo "All package versions match: $ROOT_VERSION"

  check-tag:
    name: "Check Existing Tag"
    runs-on: ubuntu-latest
    needs: detect-version-change
    if: needs.detect-version-change.outputs.has-change == 'true'
    outputs:
      has-release: ${{ steps.check.outputs.has-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag exists
        id: check
        env:
          VERSION: ${{ needs.detect-version-change.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists, skipping release"
            echo "has-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist, will release v$VERSION"
            echo "has-release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: "Build & Publish All Packages"
    runs-on: ubuntu-latest
    needs: [test, detect-version-change, verify-version-sync, check-tag]
    if: needs.check-tag.outputs.has-release == 'true'
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.9

      - name: Build all packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Build root package
          echo "=== Building root package ==="
          uv build --out-dir dist .

          # Build each workspace package
          for pkg_dir in packages/*/; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              pkg_name=$(basename "$pkg_dir")
              echo "=== Building $pkg_name ==="
              uv build --out-dir dist "$pkg_dir"
            fi
          done

          echo "=== All built artifacts ==="
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-v${{ needs.detect-version-change.outputs.version }}
          path: dist/
          retention-days: 120

      - name: Publish to PyPI
        id: publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          uv publish --token "$PYPI_TOKEN" dist/*

      - name: Create GitHub Release
        if: steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: "Release v${{ needs.detect-version-change.outputs.version }}"
          draft: false
          prerelease: ${{ needs.detect-version-change.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

  deploy_build:
    name: "Build Deploy Image"
    needs: [ test, check-coverage, format-lint, check-tag ]
    if: needs.check-tag.outputs.has-release == 'true'
    uses: ./.github/workflows/_skaffold-build-k8s.yml
    secrets: inherit
    
  deploy_sqa:
    name: "Deploy: SQA"
    needs: [ deploy_build, check-tag ]
    if: needs.check-tag.outputs.has-release == 'true'
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      environment: "jax-cluster-dev-10--sqa"

  deploy_stage:
    name: "Deploy: Stage"
    needs: [ deploy_build, detect-version-change, deploy_sqa ]
    if: needs.detect-version-change.outputs.schedule_prod_release == 'true' && needs.check-tag.outputs.has-release == 'true'
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      environment: "jax-cluster-prod-10--stage"

  deploy_prod:
    name: "Deploy: Prod"
    needs: [ deploy_build, detect-version-change, deploy_stage ]
    if: needs.detect-version-change.outputs.schedule_prod_release == 'true' && needs.check-tag.outputs.has-release == 'true'
    uses: ./.github/workflows/_skaffold-deploy-k8s.yml
    secrets: inherit
    with:
      environment: "jax-cluster-prod-10--prod"
