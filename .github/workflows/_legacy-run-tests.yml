name: 'Legacy Python Tests Definition'

# Test gate for the legacy GeneWeaver app (legacy/).
# Legacy uses Poetry (Python 3.9) and depends on native libraries (cairo, graphviz,
# imagemagick/wand, postgres client), so we install those system deps before
# `poetry install`, mirroring legacy/Dockerfile.

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to set up'
        required: false
        default: '3.9'
        type: string
      runner-os:
        description: 'Runner OS'
        required: false
        default: 'ubuntu-latest'
        type: string

jobs:
  run-tests:
    runs-on: ${{ inputs.runner-os }}
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev \
            libcairo2 libcairo2-dev \
            graphviz \
            libffi-dev \
            libpqxx-dev \
            imagemagick libmagickcore-dev libmagickwand-dev

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install dependencies with Poetry
        run: poetry install

      - name: Test with pytest
        run: poetry run pytest tests
