apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: geneweaver-api
build:
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
  artifacts:
    - image: geneweaver-api
      context: .
      docker:
          dockerfile: Dockerfile
    # Two tool-worker images, split by dependency profile rather than per tool: seven of
    # the nine tools need only wheels, two need the compiled TOOLBOX binaries. See
    # packages/tools/src/geneweaver/tools/temporal/routing.py.
    - image: geneweaver-tools-worker
      context: .
      docker:
          dockerfile: deploy/docker/Dockerfile.tools-worker
    - image: geneweaver-tools-native-worker
      context: .
      docker:
          dockerfile: deploy/docker/Dockerfile.tools-native-worker
  local:
    useBuildkit: true
test:
  - image: geneweaver-api
    structureTests:
      - deploy/tests/*
profiles:
  - name: jax-cluster-dev-10--dev
    deploy:
      kustomize:
        paths:
          - deploy/k8s/overlays/jax-cluster-dev-10--dev
  - name: jax-cluster-dev-10--sqa
    deploy:
      kustomize:
        paths:
          - deploy/k8s/overlays/jax-cluster-dev-10--sqa
  - name: jax-cluster-prod-10--stage
    deploy:
      kustomize:
        paths:
          - deploy/k8s/overlays/jax-cluster-prod-10--stage
  - name: jax-cluster-prod-10--prod
    deploy:
      kustomize:
        paths:
          - deploy/k8s/overlays/jax-cluster-prod-10--prod
